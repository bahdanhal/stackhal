        assets_text: "Apple Wallet wymaga obecności plików icon.png oraz icon@2x.png (58x58 px) do powiadomień na ekranie blokady. Brak ikony uniemożliwia dodanie karty do Portfela."
        barcodes_title: "Nieprawidłowe kodowanie i format kodów kreskowych"
