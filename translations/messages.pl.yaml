        q2: "Czy mogę otworzyć plik .pkpass na systemie Android, Windows lub Linux?"
        a2: "Tak! To narzędzie działa w 100% w przeglądarce i renderuje wierną wizualizację karty pokładowej, biletu, karty stałego klienta lub kuponu wraz z czytelnym kodem kreskowym i QR."
        q3: "Jak działa funkcja 'Napraw i pobierz .pkpass'?"
        a3: "Jeśli zmodyfikujesz pass.json lub poprawisz uszkodzone pliki, kliknięcie 'Napraw i pobierz .pkpass' przelicza sumy SHA-1 wszystkich plików w archiwum, tworzy poprawny manifest.json i pobiera spakowany plik .pkpass."
        q4: "Czy mój bilet lub karta pokładowa jest przesyłana na Wasz serwer?"
        a4: "Nie. Cała dekompresja archiwum ZIP, obliczanie sum kontrolnych SHA-1, parsowanie certyfikatów PKCS#7 i generowanie kodów kreskowych odbywa się 100% lokalnie w Twojej przeglądarce. Żadne dane nie są przesyłane ani przechowywane."

