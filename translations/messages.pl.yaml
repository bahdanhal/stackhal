        subtitle: "System iOS nie wyświetla szczegółowych błędów w interfejsie - po prostu nie otwiera uszkodzonego pliku. Oto najczęstsze przyczyny problemów wykrywane przez ten inspektor:"
        manifest_title: "Rozsynchronizowanie sum SHA-1 w manifest.json"
        manifest_text: "Zmiana daty, treści lub kodu kreskowego w pass.json bez przeliczenia jego sumy SHA-1 w manifest.json sprawia, że iOS natychmiast odrzuca bilet jako uszkodzony."
        dates_title: "Daty bez strefy czasowej w formacie ISO 8601"
        dates_text: "iOS bezwzględnie wymaga, aby pola expirationDate oraz relevantDate zawierały pełną strefę czasową (np. 2026-08-23T14:30:00+02:00 lub Z). Daty 'pływające' bez strefy powodują błąd."
