        q3: "Czy certyfikat VMC jest wymagany do wdrożenia BIMI?"
        a3: "Apple Mail i Yahoo obsługują BIMI bez certyfikatu (self-asserted). Gmail wymaga certyfikatu VMC potwierdzającego prawa do znaku towarowego."

domain_inspector:
    meta:
        title: "Inspektor domen · Sprawdzanie DMARC, BIMI, MTA-STS i SPF jednym kliknięciem"
        description: "Zweryfikuj standardy bezpieczeństwa poczty w domenie: zgodność DMARC z BIMI, dostępność rekordu BIMI i logo, MTA-STS RFC 8461, SMTP TLS-RPT oraz SPF."
    eyebrow: "BEZPIECZEŃSTWO POCZTY I DOSTARCZALNOŚĆ"
    heading: "Inspektor domen i weryfikacja BIMI"
    lede: "Sprawdź łańcuch uwierzytelniania poczty w domenie jednym kliknięciem. Zbadaj zgodność polityki DMARC z BIMI, wymuszenie szyfrowania MTA-STS, raporty TLS oraz SPF."
    title: "Inspektor domen"
    input_label: "Wpisz nazwę domeny do sprawdzenia:"
    check_btn: "Sprawdź domenę"
    examples_label: "Przykłady"
    features:
        dmarc:
            title: "Polityka DMARC i zgodność z BIMI"
            text: "Sprawdza, czy polityka spełnia wymogi wyświetlania awatarów BIMI (p=quarantine pct=100 lub p=reject) i chroni przed podszywaniem się."
        bimi:
            title: "Rekord BIMI i weryfikacja pliku logo"
            text: "Wyszukuje rekord default._bimi, sprawdza dostępność przez HTTPS, poprawność nagłówka Content-Type oraz profilu SVG Tiny 1.2."
        mta_sts:
            title: "MTA-STS Strict Transport (RFC 8461)"
            text: "Weryfikuje rekord DNS oraz plik https://mta-sts.domena/.well-known/mta-sts.txt w celu wymuszenia bezpiecznego TLS."
        tls_rpt:
            title: "SMTP TLS-RPT (RFC 8460)"
            text: "Sprawdza konfigurację raportowania błędów negocjacji TLS, aby otrzymywać powiadomienia o problemach z doręczaniem."
    faq:
        title: "Często zadawane pytania o bezpieczeństwo poczty"
        q1: "Jaka polityka DMARC jest wymagana do wyświetlania BIMI?"
        a1: "BIMI wymaga aktywnej polityki DMARC o wartości co najmniej p=quarantine (z pct=100) lub p=reject. Polityka p=none jest traktowana jako tryb obserwacji i nie kwalifikuje się do BIMI."
        q2: "Czym jest MTA-STS (RFC 8461)?"
        a2: "MTA-STS wymusza szyfrowanie TLS między serwerami pocztowymi, zapobiegając atakom typu downgrade i podsłuchiwaniu transmisji SMTP."
        q3: "Jak działa raportowanie SMTP TLS-RPT (RFC 8460)?"
        a3: "TLS-RPT pozwala serwerom wysyłającym przesyłać zbiorcze raporty telemetryczne o problemach z negocjacją szyfrowania, ułatwiając wykrywanie wygasłych certyfikatów."
    report:
        title: "Raport bezpieczeństwa poczty dla %domain% · Narzędzia Bahdana"
        back: "Sprawdź inną domenę"
        score_label: "Ocena bezpieczeństwa i dostarczalności: %score%/100"
        time_label: "Sprawdzono: %time%"
    bimi_status:
        ready: "Gotowa na BIMI"
        dmarc_needed: "Wymaga wzmocnienia DMARC dla BIMI"
        eligible_no_bimi: "DMARC spełniony · Brak rekordu BIMI"
        not_ready: "BIMI nieskonfigurowane"
    recheck_btn: "Sprawdź ponownie"
