regex_transpiler:
    meta:
        title: "Konwerter dialektów Regex i matryca zgodności · PCRE do Go RE2"
        description: "Transpiluj i waliduj wyrażenia regularne między PCRE, Go RE2, JavaScriptem, Pythonem a Rustem. Eliminuj podatności ReDoS z gwarancją czasu liniowego O(N)."
    eyebrow: "SILNIKI REGEX · PCRE ➔ GO RE2"
    heading: "Konwerter dialektów Regex i matryca zgodności"
    lede: "Konwertuj złożone wyrażenia regularne między PCRE, Go RE2, JavaScriptem, Pythonem a Rustem. Wykrywaj błędy asercji lookaround, przekształcaj grupy atomowe i kwantyfikatory zachłanne oraz weryfikuj odporność na ReDoS."
    source_label: "Dialekt źródłowy"
    target_label: "Silnik docelowy"
    presets_label: "Gotowe wzorce"
    preset_password: "Hasło (Lookahead)"
    preset_log: "Logi HTTP (Grupy nazwane)"
    preset_possessive: "Cudzysłowy (Possessive)"
    preset_slug: "Identyfikator (Case-Insensitive)"
    source_pattern_title: "Źródłowe wyrażenie regularne"
    target_pattern_title: "Przetranspilowane wyrażenie regularne"
    clear_btn: "Wyczyść"
    pattern_placeholder: "Wprowadź wyrażenie regularne (np. (?<name>[a-z]+) lub (?>foo++))..."
    test_string_label: "Ciąg testowy (Podgląd dopasowań na żywo)"
    test_string_placeholder: "Wprowadź przykładowy tekst, aby przetestować dopasowania na żywo..."
    copy_pattern_btn: "Kopiuj wzorzec"
    copy_snippet_btn: "Kopiuj fragment kodu"
    match_results_label: "Podgląd dopasowań na żywo"
    matrix_title: "Matryca zgodności dla 5 silników Regex"
    matrix_subtitle: "Ocena wsparcia składni, złożoności obliczeniowej oraz automatycznych przekształceń AST dla wszystkich wiodących silników."
    diagnostics_title: "Diagnostyka składni i zalecenia silnika"
    diagnostics_empty: "Nie wykryto żadnych ostrzeżeń składniowych ani niezgodności."
    cheatsheet_title: "Porównanie możliwości i złożoności silników Regex"
    table:
        feature: "Cecha / Możliwość"
    why_re2_title: "Dlaczego Go RE2 i Rust całkowicie eliminują ReDoS"
    why_re2_intro: "Tradycyjne silniki (PCRE, JS, Python) używają backtrackingu. W skrajnych przypadkach może on zablokować procesor w ataku ReDoS. Go RE2 i Rust korzystają z automatów skończonych (DFA/NFA), które gwarantują czas liniowy."
    benefits:
        redos:
            title: "Zero katastrofalnego backtrackingu"
            text: "RE2 gwarantuje czas wykonania wprost proporcjonalny do długości tekstu O(N), całkowicie eliminując ryzyko zawieszenia procesora."
        linear:
            title: "Przewidywalne opóźnienia mikrosekundowe"
            text: "Bez względu na to, czy tekst ma 10 bajtów czy 10 megabajtów, dopasowanie następuje w stałym tempie bez niekontrolowanego rozrostu stosu pamięci."
        security:
            title: "Bezpieczne filtry od użytkowników"
            text: "Możesz bezpiecznie przyjmować dowolne filtry regex od użytkowników w Kubernetes, Envoy i mikroserwisach chmurowych bez obaw o awarię."
        syntax:
            title: "Standaryzowane grupy nazwane"
            text: "Używa standardowej składni Go (?P<name>...) zgodnej z Pythonem i Rustem."
    faq:
        title: "Najczęściej zadawane pytania"
        q1: "Dlaczego Go RE2 odrzuca lookahead (?=...) i lookbehind (?<=...)?"
        a1: "Asercje lookaround wymagają nawracania w celu sprawdzenia warunków przed lub za wskaźnikiem bez konsumpcji znaków. Aby matematycznie zagwarantować liniowy czas O(N) i wyeliminować ataki ReDoS, RE2 zabrania asercji wyprzedzających i wstecznych."
        q2: "Dlaczego referencje wsteczne (backreferences) są zabronione w RE2?"
        a2: "Dopasowywanie wyrażeń z referencjami wstecznymi (takimi jak \\1 lub \\k<name>) jest problemem NP-zupełnym i w pesymistycznym przypadku wymaga wykładniczego czasu. RE2 ich nie obsługuje, aby utrzymać stałą wydajność liniową."
        q3: "Jak konwerter obsługuje grupy atomowe (?>...) i kwantyfikatory zachłanne ++?"
        a3: "Grupy atomowe i kwantyfikatory zaborcze służą w PCRE do ograniczania backtrackingu. Ponieważ RE2 w ogóle nie nawraca, grupy atomowe są zamieniane na grupy nieprzechwytujące (?:...), a kwantyfikatory ++ na standardowe zachłanne (+)."
        q4: "Czy przetwarzanie regex i tekstu jest bezpieczne?"
        a4: "Tak! 100% parsowania AST, oceny matrycy i dopasowywania wzorców wykonuje się lokalnie w Twojej przeglądarce za pomocą JavaScriptu. Żadne dane nie trafiają na nasze serwery."

