dns_dag_tracer:
    meta:
        title: "Śledzenie delegacji DNS na żywo · StackHal"
        description: "Sprawdź aktualne rekordy DNS i serwery autorytatywne zwrócone dla domeny."
    eyebrow: "HIERARCHICZNA DELEGACJA DNS & TRACER DAG"
    heading: "Śledzenie delegacji DNS na żywo"
    lede: "Sprawdź prawdziwą odpowiedź DNS dla domeny i zobacz jej serwery autorytatywne. Wynik pochodzi z resolvera używanego przez serwer aplikacji."
    domain_label: "Nazwa domeny:"
    record_type_label: "Typ rekordu:"
    trace_btn: "Śledź delegację DAG"
    dag_title: "Rzeczywista odpowiedź DNS"
    diagnostics_title: "Diagnostyka delegacji i DNSSEC"
    resolver_comparison: "Porównanie resolverów"
    resolver_comparison_unavailable: "Nie wykonano"
    faq:
        title: "Najczęściej zadawane pytania"
        q1: "Jak działa hierarchiczna delegacja DNS?"
        q1_a: "Rozwiązywanie nazw rozpoczyna się od 13 klastrów IANA Root (.), przechodzi do serwerów TLD (np. .com lub .pl), następnie do serwerów autorytatywnych danej domeny i kończy na publicznych resolwerach rekurencyjnych."
        q2: "Co weryfikuje walidacja DNSSEC?"
        q2_a: "DNSSEC weryfikuje kryptograficzny łańcuch zaufania, porównując rekord DS ze strefy nadrzędnej z kluczem DNSKEY strefy podrzędnej oraz sprawdzając podpisy cyfrowe RRSIG."
        q3: "Co powoduje rozbieżności w propagacji DNS podczas migracji?"
        q3_a: "Wysokie wartości TTL (>14 400s / 4 godziny) sprawiają, że buforujące resolwery przetrzymują nieaktualne rekordy aż do wygaśnięcia ich czasu ważności, co prowadzi do różnych odpowiedzi w poszczególnych regionach."
        q4: "Czym jest Lame Delegation?"
        q4_a: "Lame delegation występuje, gdy strefa nadrzędna wskazuje serwer nazw, który odrzuca zapytania lub nie jest skonfigurowany jako autorytatywny dla danej domeny."

