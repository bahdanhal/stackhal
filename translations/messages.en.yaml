    matrix_subtitle: "Real-time evaluation of syntax support, time complexity, and AST transformations across all major regex engines."
    diagnostics_title: "Syntax Diagnostics & Engine Advisories"
    diagnostics_empty: "No syntax warnings or incompatibility issues found."
    cheatsheet_title: "Regex Engine Feature & Complexity Comparison"
    table:
        feature: "Feature / Capability"
    why_re2_title: "Why Go RE2 & Rust Eliminate ReDoS Entirely"
    why_re2_intro: "Traditional regex engines (PCRE, JS, Python) use recursive backtracking, making them vulnerable to Regular Expression Denial of Service (ReDoS). Go RE2 and Rust use deterministic finite automata (DFA/NFA) with guaranteed linear execution time."
    benefits:
        redos:
            title: "Zero Catastrophic Backtracking"
            text: "RE2 guarantees execution in time proportional to the length of the input text O(N), completely eliminating CPU freeze vulnerabilities."
        linear:
            title: "Predictable Microsecond Latency"
            text: "Whether the input text is 10 bytes or 10 megabytes, RE2 matches in strict linear passes without unbounded stack memory usage."
        security:
            title: "Untrusted User Input Safe"
            text: "You can safely allow end users to supply custom regex search filters in Kubernetes, Envoy, and cloud microservices without risking server outage."
        syntax:
            title: "Standardized Named Groups"
            text: "Uses Go standard syntax (?P<name>...) matching Python and Rust conventions."
    faq:
        title: "Frequently Asked Questions"
        q1: "Why does Go RE2 reject lookahead (?=...) and lookbehind (?<=...)?"
        a1: "Lookaround assertions require backtracking to verify conditions ahead or behind without consuming characters. To mathematically guarantee linear O(N) runtime and prevent ReDoS attacks, RE2 strictly forbids all lookaround syntax."
        q2: "Why are backreferences forbidden in RE2?"
        a2: "Matching regular expressions with backreferences (like \\1 or \\k<name>) is proven to be NP-complete, requiring exponential worst-case time in backtracking engines. RE2 disallows backreferences to maintain strict linear performance."
        q3: "How does the transpiler handle atomic groups (?>...) and possessive quantifiers ++?"
        a3: "Atomic groups and possessive quantifiers exist in PCRE to suppress backtracking. Since RE2 never backtracks by default, atomic groups are converted into non-capturing groups (?:...), and possessive quantifiers (++) are simplified to standard greedy quantifiers (+)."
        q4: "Is regex transpilation and test matching performed securely?"
        a4: "Yes! 100% of the transpilation, AST parsing, matrix evaluation, and live regex matching runs entirely in your browser using client-side JavaScript. No regex patterns or test strings are sent to our servers."

