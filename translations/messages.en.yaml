    store_cta: "Install from the Chrome Web Store"
    guide_cta: "Installation details"
    extension_note: "MIT licensed · Manifest V3 · Zero runtime dependencies"
    visual_alt: "AI Studio Local File Sync extension showing a multi-file diff review"
    trust_label: "Extension characteristics"
    features_label: "Extension features"
    trust:
        local: "Local filesystem access"
        review: "Review before every write"
        private: "No telemetry or backend"
    problem:
        label: "WHY THIS EXISTS"
        title: "AI Studio has the context. Your project has the files."
        text: "This extension connects a user-selected local project to the AI Studio interface in the browser. It does not try to replace a full IDE or run a hosted coding agent."
