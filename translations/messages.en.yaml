    faq:
        title: "Frequently Asked Questions"
        q1: "How does hierarchical DNS delegation work?"
        q1_a: "DNS resolution traverses from the 13 IANA Root Clusters (.) to the TLD nameservers (e.g. .com or .pl), then to the domain's Authoritative nameservers, and finally to public recursive resolvers at the edge."
        q2: "What does DNSSEC validation verify?"
        q2_a: "DNSSEC verifies the cryptographic chain of trust by matching the parent zone's Delegation Signer (DS) record against the child zone's DNSKEY and verifying RRSIG digital signatures."
        q3: "What causes DNS propagation divergence during migrations?"
        q3_a: "High TTL values (>14,400s / 4 hours) cause caching recursive resolvers to retain stale records until their TTL expires, resulting in divergent answers across global regions."
        q4: "What is a Lame Delegation?"
        q4_a: "A lame delegation occurs when a parent zone designates a nameserver that refuses queries or is not configured as authoritative for the zone."

