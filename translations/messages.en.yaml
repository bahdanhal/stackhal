        q1: "Why can an MIT package still need a license review?"
        a1: "The MIT declaration normally covers the package author's own code. Dependencies retain their own licenses, so distribution, linking, notices, and derivative-work questions must be checked separately."
        q2: "What is the difference between GPL and OSL-3.0?"
        a2: "OSL-3.0 includes an External Deployment condition for the Original Work or a Derivative Work. Whether a particular integration is a derivative work is context-specific and cannot be decided from a dependency edge alone."
        q3: "Is using an LGPL library like HTMLPurifier permitted in proprietary PHP code?"
        a3: "Often, but the answer depends on the LGPL version and how the library is combined and distributed. Preserve notices and verify replacement, relinking, and source-offer requirements for the exact release."
        q4: "Can AI coding assistants detect these license conflicts automatically?"
        a4: "AI can identify dependency and metadata signals, but it cannot replace source inspection or legal analysis. This tool supplies evidence paths and explicit uncertainty for a human review."
