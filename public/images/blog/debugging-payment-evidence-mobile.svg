<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 647" role="img" aria-labelledby="title desc"><title id="title">Evidence for a missing order</title><desc id="desc">A hypothetical payment succeeds and its callback returns 200, but no order is found. Connect the release, configuration, event payload, retries, queue and database commit using the same payment or event identifier.</desc><rect width="400" height="647" fill="#f2f3eb"/><text x="20" y="35" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="600" fill="#26392f">A payment is not yet an order</text><text x="20" y="66" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#54665a">A hypothetical incident</text><rect x="20" y="94" width="360" height="90" rx="3" fill="none" stroke="#bfcabb"/><text x="38" y="127" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600" fill="#26392f">1. Payment</text><text x="38" y="161" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#246648">Succeeded</text><path d="M200 188v14m-5-5 5 5 5-5" fill="none" stroke="#246648" stroke-width="2" stroke-dasharray=""/><rect x="20" y="207" width="360" height="90" rx="3" fill="none" stroke="#bfcabb"/><text x="38" y="240" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600" fill="#26392f">2. Callback</text><text x="38" y="274" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#246648">Returned HTTP 200</text><path d="M200 301v14m-5-5 5 5 5-5" fill="none" stroke="#246648" stroke-width="2" stroke-dasharray=""/><rect x="20" y="320" width="360" height="90" rx="3" fill="none" stroke="#bfcabb"/><text x="38" y="353" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600" fill="#26392f">3. Order</text><text x="38" y="387" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#a13d30">Not found</text><text x="20" y="450" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="600" fill="#26392f">Evidence to connect</text><text x="20" y="484" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#26392f">Release + configuration</text><text x="20" y="518" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#26392f">Payload + retries + queue</text><text x="20" y="552" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#26392f">Order transaction commit</text><path d="M20 579H380" fill="none" stroke="#bfcabb" stroke-width="2" stroke-dasharray=""/><text x="20" y="615" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600" fill="#246648">Use the same payment / event ID.</text></svg>