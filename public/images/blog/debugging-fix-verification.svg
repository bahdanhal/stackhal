<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 542" role="img" aria-labelledby="title desc"><title id="title">Checking a fix beyond the absence of a crash</title><desc id="desc">A hypothetical failing request crashes and is not processed by the original code. Dropping the request removes the crash but still does not process it. A valid correction both removes the crash and completes the intended processing. Check both properties and run the existing regression suite.</desc><rect width="800" height="542" fill="#f2f3eb"/><text x="32" y="43" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="600" fill="#26392f">No crash does not necessarily mean fixed</text><text x="32" y="78" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#54665a">Replay the failing request, then check its required outcome.</text><text x="32" y="137" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600" fill="#26392f">Same failing request</text><text x="420" y="137" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600" fill="#26392f">No crash?</text><text x="588" y="137" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600" fill="#26392f">Processed?</text><path d="M32 157H768" fill="none" stroke="#bfcabb" stroke-width="2" stroke-dasharray=""/><text x="32" y="203" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="600" fill="#26392f">Original code</text><text x="450" y="203" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="600" fill="#a13d30">No</text><text x="627" y="203" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="600" fill="#a13d30">No</text><path d="M32 231H768" fill="none" stroke="#bfcabb" stroke-width="2" stroke-dasharray=""/><text x="32" y="282" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="600" fill="#26392f">Drop the request</text><text x="450" y="282" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="600" fill="#246648">Yes</text><text x="627" y="282" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="600" fill="#a13d30">No</text><path d="M32 310H768" fill="none" stroke="#bfcabb" stroke-width="2" stroke-dasharray=""/><text x="32" y="361" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="600" fill="#26392f">Valid correction</text><text x="450" y="361" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="600" fill="#246648">Yes</text><text x="627" y="361" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="600" fill="#246648">Yes</text><path d="M32 389H768" fill="none" stroke="#bfcabb" stroke-width="2" stroke-dasharray=""/><rect x="32" y="422" width="736" height="86" rx="3" fill="#e3e9de" stroke="#bfcabb"/><text x="52" y="454" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="600" fill="#26392f">A useful regression test checks both properties.</text><text x="52" y="485" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#54665a">Then run the existing tests for the rest of the program.</text></svg>