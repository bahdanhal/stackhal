<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" role="img" aria-labelledby="mcp-clients-title mcp-clients-desc">
  <title id="mcp-clients-title">POST /mcp requests across all four servers over 25 hours (2–3 November 2026)</title>
  <desc id="mcp-clients-desc">9,325 POST requests from 120 distinct client names: FixterMonitoring 2,280, mcpbeat 1,562, Claude Code 1,536, Claude connector 1,121 (1,061 on OBD Vault), Codex 152, and 115 other crawlers, registries, and probes totaling 2,674.</desc>
  <rect width="920" height="430" fill="#fafafa" stroke="#e5e5e5" stroke-width="1"/>
  <g font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" fill="#202020">
    <text x="36" y="36" font-size="18" font-weight="600" letter-spacing="-0.02em">Who connects to the four /mcp endpoints · 9,325 POST requests in 25 hours</text>
    <text x="36" y="58" font-size="13" fill="#666666">Caddy access log, 2 Nov 17:27 – 3 Nov 18:44 UTC · 120 distinct client names across bahdanhal.pl, ileza.pl, stackhal.com, obd-vault.com</text>
  </g>
  <g font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="14" fill="#202020">
    <!-- Row 1: FixterMonitoring -->
    <text x="36" y="108" font-weight="600">FixterMonitoring</text>
    <text x="36" y="126" font-size="12" fill="#666666">Monitor · ileza.pl (1,521) &amp; OBD Vault (759)</text>
    <rect x="400" y="94" width="375" height="28" fill="#202020"/>
    <text x="785" y="113" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600">2,280</text>

    <!-- Row 2: mcpbeat -->
    <text x="36" y="162" font-weight="600">mcpbeat</text>
    <text x="36" y="180" font-size="12" fill="#666666">Monitor · checks all four every 1–3 min</text>
    <rect x="400" y="148" width="257" height="28" fill="#202020"/>
    <text x="667" y="167" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600">1,562</text>

    <!-- Row 3: Claude Code -->
    <text x="36" y="216" font-weight="600">Claude Code (my sessions)</text>
    <text x="36" y="234" font-size="12" fill="#666666">stackhal (528) · bahdanhal (524) · ileza (484)</text>
    <rect x="400" y="202" width="253" height="28" fill="#da3c1a"/>
    <text x="663" y="221" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#a3261b">1,536</text>

    <!-- Row 4: Claude Connector -->
    <text x="36" y="270" font-weight="600">Claude connector (reading my Citroën)</text>
    <text x="36" y="288" font-size="12" fill="#666666">1,061 on OBD Vault + 20 on each PHP site</text>
    <rect x="400" y="256" width="184" height="28" fill="#da3c1a"/>
    <text x="594" y="275" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#a3261b">1,121</text>

    <!-- Row 5: Codex -->
    <text x="36" y="324" font-weight="600">Codex (my sessions)</text>
    <text x="36" y="342" font-size="12" fill="#666666">stackhal.com · ileza.pl · bahdanhal.pl</text>
    <rect x="400" y="310" width="25" height="28" fill="#da3c1a"/>
    <text x="435" y="329" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#a3261b">152</text>

    <!-- Row 6: 115 other catalogues & probes -->
    <text x="36" y="378" font-weight="600">115 other directories, crawlers &amp; probes</text>
    <text x="36" y="396" font-size="12" fill="#666666">rokmcp-collector, AgentRankProbe, ToolVetProbe…</text>
    <rect x="400" y="364" width="440" height="28" fill="#767676"/>
    <text x="850" y="383" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#555555">2,674</text>
  </g>
</svg>
