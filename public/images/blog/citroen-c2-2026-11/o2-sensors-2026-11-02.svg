  <title id="o2-title">Upstream vs. downstream oxygen sensor voltage on a warm engine (2 November 2026)</title>
  <desc id="o2-desc">500 readings over 12 minutes at 75-83 degrees Celsius coolant temperature. The upstream sensor stays between 0.15 V and 0.38 V without crossing 0.45 V, while the downstream sensor after the catalyst stays above 0.70 V in 498 of 500 readings.</desc>
