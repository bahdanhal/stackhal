<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" role="img" aria-labelledby="title desc"><title id="title">Reproducing a lost update in four ordered steps</title><desc id="desc">Start with counter zero. Step 1: worker A reads zero and pauses before writing. Step 2: worker B reads zero. Step 3: worker B writes one. Step 4: worker A resumes and writes one. Expected final counter two, actual counter one. A controlled test forces this ordering.</desc><rect width="800" height="550" fill="#f2f3eb"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="42" font-size="27" font-weight="600" text-anchor="start" fill="#26392f">Turn a rare race into a repeatable test</text><text x="32" y="78" font-size="20" font-weight="400" text-anchor="start" fill="#54665a">Illustrative lost update: two workers increment one counter.</text><text x="32" y="128" font-size="22" font-weight="600" text-anchor="start" fill="#26392f">Start: counter = 0</text><text x="649" y="128" font-size="20" font-weight="400" text-anchor="start" fill="#54665a">time →</text><text x="32" y="246" font-size="21" font-weight="600" text-anchor="start" fill="#26392f">Worker A</text><text x="32" y="356" font-size="21" font-weight="600" text-anchor="start" fill="#26392f">Worker B</text><path d="M169 240H754" fill="none" stroke="#bfcabb" stroke-width="2" stroke-dasharray=""/><path d="M169 350H754" fill="none" stroke="#bfcabb" stroke-width="2" stroke-dasharray=""/><path d="M229 240H670" fill="none" stroke="#246648" stroke-width="3" stroke-dasharray="5 5"/><text x="210" y="209" font-size="21" font-weight="400" text-anchor="middle" fill="#26392f">read 0</text><circle cx="210" cy="240" r="16" fill="#246648"/><text x="210" y="246" font-size="18" font-weight="600" text-anchor="middle" fill="#fff">1</text><text x="690" y="186" font-size="18" font-weight="400" text-anchor="middle" fill="#54665a">resume</text><text x="690" y="209" font-size="21" font-weight="400" text-anchor="middle" fill="#26392f">write 1</text><circle cx="690" cy="240" r="16" fill="#246648"/><text x="690" y="246" font-size="18" font-weight="600" text-anchor="middle" fill="#fff">4</text><text x="450" y="278" font-size="20" font-weight="600" text-anchor="middle" fill="#246648">A is paused while B runs</text><text x="370" y="319" font-size="21" font-weight="400" text-anchor="middle" fill="#26392f">read 0</text><circle cx="370" cy="350" r="16" fill="#246648"/><text x="370" y="356" font-size="18" font-weight="600" text-anchor="middle" fill="#fff">2</text><text x="530" y="319" font-size="21" font-weight="400" text-anchor="middle" fill="#26392f">write 1</text><circle cx="530" cy="350" r="16" fill="#246648"/><text x="530" y="356" font-size="18" font-weight="600" text-anchor="middle" fill="#fff">3</text><text x="32" y="411" font-size="21" font-weight="600" text-anchor="start" fill="#246648">The test forces the sequence: 1 → 2 → 3 → 4.</text><path d="M32 443H768" fill="none" stroke="#bfcabb" stroke-width="2" stroke-dasharray=""/><text x="32" y="479" font-size="20" font-weight="400" text-anchor="start" fill="#54665a">Expected</text><text x="32" y="515" font-size="25" font-weight="600" text-anchor="start" fill="#26392f">counter = 2</text><text x="300" y="479" font-size="20" font-weight="400" text-anchor="start" fill="#54665a">Actual</text><text x="300" y="515" font-size="25" font-weight="600" text-anchor="start" fill="#a13d30">counter = 1</text><text x="566" y="479" font-size="20" font-weight="600" text-anchor="start" fill="#a13d30">Lost update</text><text x="566" y="514" font-size="20" font-weight="400" text-anchor="start" fill="#26392f">Both wrote 0 + 1.</text></g></svg>
