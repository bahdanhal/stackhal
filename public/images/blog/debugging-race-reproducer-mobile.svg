<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 624" role="img" aria-labelledby="title desc"><title id="title">Reproducing a lost update in four ordered steps</title><desc id="desc">Start with counter zero. Step 1: worker A reads zero and pauses before writing. Step 2: worker B reads zero. Step 3: worker B writes one. Step 4: worker A resumes and writes one. Expected final counter two, actual counter one. A controlled test forces this ordering.</desc><rect width="400" height="624" fill="#f2f3eb"/><g font-family="Arial, Helvetica, sans-serif"><text x="20" y="34" font-size="24" font-weight="600" text-anchor="start" fill="#26392f">Make the race repeatable</text><text x="20" y="66" font-size="19" font-weight="400" text-anchor="start" fill="#54665a">Example: a lost counter update</text><text x="20" y="110" font-size="21" font-weight="600" text-anchor="start" fill="#26392f">Start: counter = 0</text><path d="M38 169V412" fill="none" stroke="#bfcabb" stroke-width="2" stroke-dasharray=""/><circle cx="38" cy="166" r="16" fill="#246648"/><text x="38" y="172" font-size="18" font-weight="600" text-anchor="middle" fill="#fff">1</text><text x="72" y="172" font-size="22" font-weight="600" text-anchor="start" fill="#26392f">A reads 0</text><text x="72" y="200" font-size="17" font-weight="400" text-anchor="start" fill="#54665a">Pause A before it writes.</text><circle cx="38" cy="248" r="16" fill="#246648"/><text x="38" y="254" font-size="18" font-weight="600" text-anchor="middle" fill="#fff">2</text><text x="72" y="254" font-size="22" font-weight="600" text-anchor="start" fill="#26392f">B reads 0</text><text x="72" y="282" font-size="17" font-weight="400" text-anchor="start" fill="#54665a">A is still paused.</text><circle cx="38" cy="330" r="16" fill="#246648"/><text x="38" y="336" font-size="18" font-weight="600" text-anchor="middle" fill="#fff">3</text><text x="72" y="336" font-size="22" font-weight="600" text-anchor="start" fill="#26392f">B writes 1</text><text x="72" y="364" font-size="17" font-weight="400" text-anchor="start" fill="#54665a">The shared value is now 1.</text><circle cx="38" cy="412" r="16" fill="#246648"/><text x="38" y="418" font-size="18" font-weight="600" text-anchor="middle" fill="#fff">4</text><text x="72" y="418" font-size="22" font-weight="600" text-anchor="start" fill="#26392f">A resumes; writes 1</text><text x="72" y="446" font-size="17" font-weight="400" text-anchor="start" fill="#54665a">A still uses its earlier read of 0.</text><path d="M20 481H380" fill="none" stroke="#bfcabb" stroke-width="2" stroke-dasharray=""/><text x="20" y="516" font-size="23" font-weight="600" text-anchor="start" fill="#26392f">Expected: 2</text><text x="216" y="516" font-size="23" font-weight="600" text-anchor="start" fill="#a13d30">Actual: 1</text><text x="20" y="551" font-size="20" font-weight="400" text-anchor="start" fill="#54665a">Both workers wrote 0 + 1.</text><text x="20" y="592" font-size="20" font-weight="600" text-anchor="start" fill="#246648">Force steps 1 → 2 → 3 → 4.</text></g></svg>
