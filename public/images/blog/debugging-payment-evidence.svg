<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 570" role="img" aria-labelledby="title desc"><title id="title">Evidence required for a missing order</title><desc id="desc">A hypothetical payment succeeds and its callback returns HTTP 200, but no order is found. The investigation must connect the deployed release, event payload, retries, queue delivery and database commit using the same payment or event identifier.</desc><rect width="800" height="570" fill="#f2f3eb"/><text x="32" y="43" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="600" fill="#26392f">A paid transaction is not yet an order</text><text x="32" y="78" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#54665a">Hypothetical incident: follow the evidence between services.</text><rect x="32" y="119" width="220" height="145" rx="3" fill="none" stroke="#bfcabb"/><text x="50" y="153" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600" fill="#26392f">Payment</text><text x="50" y="240" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#246648">Succeeded</text><rect x="290" y="119" width="220" height="145" rx="3" fill="none" stroke="#bfcabb"/><text x="308" y="153" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600" fill="#26392f">Callback</text><text x="308" y="240" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#246648">Returned 200</text><rect x="548" y="119" width="220" height="145" rx="3" fill="none" stroke="#bfcabb"/><text x="566" y="153" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600" fill="#26392f">Order</text><text x="566" y="240" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#a13d30">Not found</text><path d="M55 171h31v39l-5-3-5 3-5-3-5 3-5-3-6 3z" fill="none" stroke="#246648" stroke-width="2" stroke-dasharray=""/><path d="M61 180h18m-18 7h18m-18 7h11" fill="none" stroke="#246648" stroke-width="2" stroke-dasharray=""/><text x="310" y="198" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="600" fill="#246648">HTTP 200</text><path d="M570 173h43v35h-43zm0 12h43m-30-12v35" fill="none" stroke="#a13d30" stroke-width="2" stroke-dasharray=""/><text x="625" y="200" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="600" fill="#a13d30">?</text><path d="M258 188h25m-8-7 8 7-8 7" fill="none" stroke="#246648" stroke-width="2" stroke-dasharray=""/><path d="M516 188h25m-8-7 8 7-8 7" fill="none" stroke="#a13d30" stroke-width="2" stroke-dasharray="4 4"/><path d="M32 301h736" fill="none" stroke="#bfcabb" stroke-width="2" stroke-dasharray=""/><text x="32" y="341" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="600" fill="#26392f">What the investigation still needs</text><text x="32" y="384" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600" fill="#246648">Release</text><text x="195" y="384" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#26392f">Which commit and configuration ran?</text><text x="32" y="430" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600" fill="#246648">Event trail</text><text x="195" y="430" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#26392f">Payload, retries, and queue delivery</text><text x="32" y="476" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600" fill="#246648">Database</text><text x="195" y="476" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#26392f">Did the order transaction commit?</text><text x="32" y="538" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="600" fill="#26392f">Connect records using the same payment / event ID.</text></svg>