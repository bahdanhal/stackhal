<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="barRust" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="barWarn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="barHigh" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f87171"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1000" height="540" rx="16" fill="url(#bgGrad2)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Top Chrome Bar -->
  <rect x="0" y="0" width="1000" height="42" rx="16" fill="#0f172a" />
  <rect x="0" y="24" width="1000" height="18" fill="#0f172a" />
  <line x1="0" y1="42" x2="1000" y2="42" stroke="#1e293b" stroke-width="1.5"/>
  <circle cx="24" cy="21" r="5" fill="#f43f5e"/>
  <circle cx="40" cy="21" r="5" fill="#eab308"/>
  <circle cx="56" cy="21" r="5" fill="#22c55e"/>
  <text x="80" y="25" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="12" font-weight="600">ecosystem_vulnerability_matrix.benchmark (N=34,187 Repos, 171,796 Dependencies)</text>

  <!-- Header -->
  <text x="40" y="82" fill="#f8fafc" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="800">The Compiler Shield: Dependency Age &amp; Vulnerability by Ecosystem</text>
  <text x="40" y="106" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="13">Comparing median package age on day zero vs. % of repositories initialized with deprecated or EOL code.</text>

  <!-- Table/Bar Grid Container -->
  <g transform="translate(40, 130)">
    <rect x="0" y="0" width="920" height="370" rx="12" fill="#0d1320" stroke="#1e293b" stroke-width="1"/>

    <!-- Column Headers -->
    <text x="24" y="32" fill="#64748b" font-family="ui-monospace, monospace" font-size="11" font-weight="700">ECOSYSTEM</text>
    <text x="180" y="32" fill="#64748b" font-family="ui-monospace, monospace" font-size="11" font-weight="700">MEDIAN DEPENDENCY AGE AT REPO BIRTH</text>
    <text x="640" y="32" fill="#64748b" font-family="ui-monospace, monospace" font-size="11" font-weight="700">DAYS</text>
    <text x="740" y="32" fill="#64748b" font-family="ui-monospace, monospace" font-size="11" font-weight="700">VULNERABLE / EOL</text>
    <line x1="24" y1="46" x2="896" y2="46" stroke="#1e293b" stroke-width="1"/>

    <!-- Row 1: Rust (The Gold Standard) -->
    <text x="24" y="82" fill="#34d399" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="750">Rust (Cargo)</text>
    <rect x="180" y="68" width="60" height="22" rx="4" fill="url(#barRust)"/>
    <text x="640" y="84" fill="#34d399" font-family="ui-monospace, monospace" font-size="13" font-weight="800">47 days</text>
    <text x="740" y="84" fill="#34d399" font-family="ui-monospace, monospace" font-size="13" font-weight="700">1.0% depr (0% EOL)</text>

    <!-- Row 2: PHP (Composer) -->
    <text x="24" y="132" fill="#e2e8f0" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="750">PHP (Composer)</text>
    <rect x="180" y="118" width="58" height="22" rx="4" fill="#3b82f6"/>
    <text x="640" y="134" fill="#93c5fd" font-family="ui-monospace, monospace" font-size="13" font-weight="800">45 days</text>
    <text x="740" y="134" fill="#f87171" font-family="ui-monospace, monospace" font-size="13" font-weight="700">12.2% EOL Runtimes</text>

    <!-- Row 3: Python (PyPI) -->
    <text x="24" y="182" fill="#e2e8f0" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="750">Python (PyPI)</text>
    <rect x="180" y="168" width="260" height="22" rx="4" fill="url(#barWarn)"/>
    <text x="640" y="184" fill="#fbbf24" font-family="ui-monospace, monospace" font-size="13" font-weight="800">236 days (~8 mos)</text>
    <text x="740" y="184" fill="#fbbf24" font-family="ui-monospace, monospace" font-size="13" font-weight="700">9.5% EOL Targets</text>

    <!-- Row 4: TypeScript (npm) -->
    <text x="24" y="232" fill="#e2e8f0" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="750">TypeScript (npm)</text>
    <rect x="180" y="218" width="310" height="22" rx="4" fill="url(#barHigh)"/>
    <text x="640" y="234" fill="#f87171" font-family="ui-monospace, monospace" font-size="13" font-weight="800">274 days (~9 mos)</text>
    <text x="740" y="234" fill="#f87171" font-family="ui-monospace, monospace" font-size="13" font-weight="700">12.4% DEPRECATED</text>

    <!-- Row 5: JavaScript (npm) -->
    <text x="24" y="282" fill="#e2e8f0" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="750">JavaScript (npm)</text>
    <rect x="180" y="268" width="380" height="22" rx="4" fill="url(#barHigh)"/>
    <text x="640" y="284" fill="#f87171" font-family="ui-monospace, monospace" font-size="13" font-weight="800">337 days (~11 mos)</text>
    <text x="740" y="284" fill="#f87171" font-family="ui-monospace, monospace" font-size="13" font-weight="700">9.3% DEPRECATED</text>

    <!-- Row 6: Go (Directives) -->
    <text x="24" y="332" fill="#f87171" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="750">Go (go.mod)</text>
    <rect x="180" y="318" width="420" height="22" rx="4" fill="#dc2626"/>
    <text x="640" y="334" fill="#fca5a5" font-family="ui-monospace, monospace" font-size="13" font-weight="800">Directives Lag</text>
    <text x="740" y="334" fill="#ef4444" font-family="ui-monospace, monospace" font-size="13" font-weight="900">50.6% EOL COMPILERS</text>
  </g>
</svg>