<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 629" role="img" aria-labelledby="title desc"><title id="title">Checking the intended result of a fix</title><desc id="desc">The original failing request crashes and is not processed. Dropping it removes the crash but still does not process it. A valid correction removes the crash and preserves the intended processing. Check both properties and run the existing tests.</desc><rect width="400" height="629" fill="#f2f3eb"/><text x="20" y="35" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="600" fill="#26392f">No crash is not enough</text><text x="20" y="67" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#54665a">Replay the same failing request.</text><rect x="20" y="95" width="360" height="130" rx="3" fill="none" stroke="#bfcabb"/><text x="38" y="127" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600" fill="#26392f">Original code</text><text x="38" y="166" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#26392f">No crash?</text><text x="295" y="166" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="600" fill="#a13d30">No</text><text x="38" y="201" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#26392f">Processed?</text><text x="295" y="201" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="600" fill="#a13d30">No</text><rect x="20" y="245" width="360" height="130" rx="3" fill="none" stroke="#bfcabb"/><text x="38" y="277" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600" fill="#26392f">Drop the request</text><text x="38" y="316" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#26392f">No crash?</text><text x="295" y="316" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="600" fill="#246648">Yes</text><text x="38" y="351" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#26392f">Processed?</text><text x="295" y="351" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="600" fill="#a13d30">No</text><rect x="20" y="395" width="360" height="130" rx="3" fill="none" stroke="#bfcabb"/><text x="38" y="427" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600" fill="#26392f">Valid correction</text><text x="38" y="466" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#26392f">No crash?</text><text x="295" y="466" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="600" fill="#246648">Yes</text><text x="38" y="501" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#26392f">Processed?</text><text x="295" y="501" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="600" fill="#246648">Yes</text><text x="20" y="565" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600" fill="#246648">Check both properties.</text><text x="20" y="599" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#54665a">Then run the existing tests.</text></svg>